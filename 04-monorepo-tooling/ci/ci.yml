name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TSC Version
        run: bunx tsc --version

      - name: emit worker types
        run: cd packages/worker && bunx tsc --project tsconfig.json

      - name: Typecheck wired packages
        run: bun run scripts/ci-check.ts typecheck

      - name: Test wired packages
        run: bun run scripts/ci-check.ts test

      - name: Lint
        run: bunx biome check
