services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingest-worker:
    build:
      context: .
      dockerfile: packages/ingest-worker/Dockerfile
    init: true
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ingest-scheduler:
    build:
      context: .
      dockerfile: packages/ingest-scheduler/Dockerfile
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ingest-dashboard:
    build:
      context: .
      dockerfile: packages/ingest-dashboard/Dockerfile
    env_file: .env
    environment:
      REDIS_HOST: redis
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data: